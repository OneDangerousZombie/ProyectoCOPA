<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Partidos — COPA</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/crear-partido.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Partidos</h1>
        </div>

        <main class="main-content">

            <!-- Botón principal crear partido -->
            <button class="create-match-hero" id="createMatchBtn" onclick="window.location.href='nuevo-partido.html'">
                <div class="create-match-hero-icon">⚽</div>
                <div class="create-match-hero-text">
                    <span class="create-match-hero-title">Crear Partido</span>
                    <span class="create-match-hero-sub">Configurá equipos e iniciá el partido</span>
                </div>
                <span class="create-match-hero-arrow">›</span>
            </button>

            <!-- Lista partidos pendientes -->
            <div class="upcoming-matches">
                <h3>Partidos pendientes</h3>
                <div id="upcomingMatchesList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        No hay partidos pendientes.
                    </div>
                </div>
            </div>

        </main>

        <!-- MODAL CREAR PARTIDO (multi-paso) -->
        <div class="modal" id="createMatchModal">
            <div class="modal-content">
                <div class="modal-handle"></div>
                <div class="modal-header">
                    <div>
                        <div class="modal-step-label" id="modalStepLabel">Paso 1 de 3</div>
                        <h3 id="modalStepTitle">Datos del partido</h3>
                    </div>
                    <button class="close-modal" id="closeModalBtn">&times;</button>
                </div>

                <div class="step-dots">
                    <div class="step-dot active" id="dot1"></div>
                    <div class="step-dot" id="dot2"></div>
                    <div class="step-dot" id="dot3"></div>
                </div>

                <div class="modal-body">

                    <!-- PASO 1 -->
                    <div id="step1">
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="matchDate">
                        </div>
                        <div class="form-group">
                            <label>Cancha</label>
                            <input type="text" id="matchVenue" placeholder="Nombre de la cancha">
                        </div>
                        <div class="form-group">
                            <label>Formato</label>
                            <div class="format-grid">
                                <button class="format-btn" data-format="5">5 vs 5</button>
                                <button class="format-btn" data-format="6">6 vs 6</button>
                                <button class="format-btn" data-format="7">7 vs 7</button>
                                <button class="format-btn" data-format="8">8 vs 8</button>
                                <button class="format-btn" data-format="9">9 vs 9</button>
                                <button class="format-btn" data-format="11">11 vs 11</button>
                            </div>
                        </div>
                        <button class="step-next-btn" id="step1Next" disabled>Siguiente — Elegir jugadores →</button>
                    </div>

                    <!-- PASO 2 -->
                    <div id="step2" class="hidden">
                        <div class="players-count-bar">
                            <span>Seleccionados</span>
                            <span class="players-count-numbers">
                                <strong id="selectedCount">0</strong>/<span id="requiredCount">10</span>
                            </span>
                        </div>
                        <div class="players-progress">
                            <div class="players-progress-fill" id="playersProgressFill"></div>
                        </div>
                        <div class="players-selection" id="playersSelection"></div>
                        <div class="step-nav">
                            <button class="step-back-btn" id="step2Back">← Volver</button>
                            <button class="step-next-btn step-next-inline" id="step2Next" disabled>Armar equipos →</button>
                        </div>
                    </div>

                    <!-- PASO 3 -->
                    <div id="step3" class="hidden">
                        <button class="balance-btn" id="balanceTeamsBtn">⚖️ Balancear equipos</button>
                        <div class="teams-container">
                            <div class="team-box">
                                <h4>Equipo Blanco</h4>
                                <div id="whiteTeamList"></div>
                                <button class="edit-team-btn" data-team="white">✏️ Editar</button>
                            </div>
                            <div class="team-box">
                                <h4>Equipo Negro</h4>
                                <div id="blackTeamList"></div>
                                <button class="edit-team-btn" data-team="black">✏️ Editar</button>
                            </div>
                        </div>
                        <div class="elo-diff" id="eloDiff"></div>
                        <div class="step-nav">
                            <button class="step-back-btn" id="step3Back">← Volver</button>
                            <button class="save-match-btn" id="saveMatchBtn">🚀 Guardar e iniciar</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- MODAL EDITAR EQUIPOS -->
        <div class="modal" id="editTeamsModal">
            <div class="modal-content">
                <div class="modal-handle"></div>
                <div class="modal-header">
                    <h3>Editar Equipos</h3>
                    <button class="close-edit-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="edit-teams-container">
                        <div class="edit-team">
                            <h4>Equipo Blanco</h4>
                            <div id="editWhiteList"></div>
                        </div>
                        <div class="edit-team">
                            <h4>Equipo Negro</h4>
                            <div id="editBlackList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item" data-page="home"><span class="nav-icon">🏠</span>Inicio</div>
            <div class="nav-item" data-page="liga"><span class="nav-icon">👥</span>Liga</div>
            <div class="nav-item active" data-page="crear-partido"><span class="nav-icon">⚽</span>Partidos</div>
            <div class="nav-item" data-page="estadisticas"><span class="nav-icon">📊</span>Stats</div>
            <div class="nav-item" data-page="perfil"><span class="nav-icon">👤</span>Perfil</div>
        </nav>
    </div>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/crear-partido.js"></script>
</body>
</html>
