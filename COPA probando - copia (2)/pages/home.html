<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inicio — COPA</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/home.css">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="header">
            <h1>COPA</h1>
            <div class="header-actions">
                <div class="avatar">👤</div>
            </div>
        </div>

        <!-- Main -->
        <main class="main-content">

            <!-- Carrusel de Partidos -->
            <div class="carousel-section">
                <div class="carousel-header">
                    <button class="carousel-nav" id="prevFecha">‹</button>
                    <h2 id="fechaTitle">Fecha 7 Apertura</h2>
                    <button class="carousel-nav" id="nextFecha">›</button>
                </div>

                <div class="match-card" id="currentMatch">
                    <div class="match-teams">
                        <div class="team">BLANCO</div>
                        <div class="score">0 - 0</div>
                        <div class="team">NEGRO</div>
                    </div>
                </div>

                <div class="timeline" id="timeline">
                    <div class="timeline-item left">
                        <span class="time">04'</span>
                        <span class="event">⚽ Brandon</span>
                        <span class="assist">🎯 Rama</span>
                    </div>
                    <div class="timeline-item right">
                        <span class="time">12'</span>
                        <span class="event">⚽ Chanchi</span>
                    </div>
                </div>

                <button class="stats-btn" id="viewStatsBtn">📊 Ver estadísticas del partido</button>
            </div>

            <!-- Mi Desempeño -->
            <div class="performance-card">
                <h3>Mi Desempeño</h3>
                <div class="performance-stats">
                    <div>
                        <div class="points">
                            <span class="value" id="userPoints">2450</span>
                            <span class="label">pts</span>
                        </div>
                        <span class="trend up" id="lastPoints">↑ +45 último partido</span>
                    </div>
                    <div class="stats-grid">
                        <div class="stat"><span class="label">PJ</span><span class="value" id="pj">24</span></div>
                        <div class="stat"><span class="label">PG</span><span class="value" id="pg">15</span></div>
                        <div class="stat"><span class="label">PE</span><span class="value" id="pe">4</span></div>
                        <div class="stat"><span class="label">PP</span><span class="value" id="pp">5</span></div>
                        <div class="stat"><span class="label">Goles</span><span class="value" id="goles">42</span></div>
                        <div class="stat"><span class="label">Asist.</span><span class="value" id="asistencias">28</span></div>
                    </div>
                </div>
            </div>

            <!-- Top 6 Liga -->
            <div class="top-players">
                <div class="section-header">
                    <h3>🏆 Top Liga</h3>
                    <button class="link-btn" id="viewFullTable">Ver tabla completa →</button>
                </div>
                <div class="players-list" id="topPlayersList">
                    <!-- JS popula -->
                </div>
            </div>

        </main>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                Inicio
            </div>
            <div class="nav-item" data-page="liga">
                <span class="nav-icon">👥</span>
                Liga
            </div>
            <div class="nav-item" data-page="crear-partido">
                <span class="nav-icon">⚽</span>
                Partidos
            </div>
            <div class="nav-item" data-page="estadisticas">
                <span class="nav-icon">📊</span>
                Stats
            </div>
            <div class="nav-item" data-page="perfil">
                <span class="nav-icon">👤</span>
                Perfil
            </div>
        </nav>

    </div>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/home.js"></script>
</body>
</html>
