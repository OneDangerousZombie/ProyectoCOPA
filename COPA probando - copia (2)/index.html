<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>COPA</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">⚽</div>
            <h1>COPA</h1>
            <p>Computación de Organización y Parejos Automáticos</p>
        </div>

        <div class="form-card">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Tu usuario" value="usuario" autocomplete="username">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" value="123" autocomplete="current-password">
            </div>
            <button class="login-btn" onclick="handleLogin()">Ingresar</button>
        </div>

        <div class="demo-hint">
            <span class="dot"></span>
            Cualquier usuario y contraseña son válidos
        </div>
    </div>

    <script src="scripts/index.js"></script>
</body>
</html>
