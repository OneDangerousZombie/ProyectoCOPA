<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuevo Partido — COPA</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/nuevo-partido.css">
</head>
<body>
    <div class="app-container">

        <div class="header">
            <button type="button" class="back-btn" onclick="window.location.href='crear-partido.html'">‹</button>
            <h1>Nuevo Partido</h1>
            <div class="header-spacer"></div>
        </div>

        <main class="np-main">

            <!-- Datos del partido -->
            <div class="np-section">
                <div class="np-section-label">Datos del partido</div>

                <div class="np-field">
                    <label>Fecha</label>
                    <input type="date" id="npDate">
                </div>

                <div class="np-field">
                    <label>Hora</label>
                    <input type="time" id="npTime">
                </div>

                <div class="np-field">
                    <label>Cancha</label>
                    <input type="text" id="npVenue" placeholder="Ej: Mega Fútbol - Cancha 3" autocomplete="off">
                </div>

                <div class="np-field">
                    <label>Formato</label>
                    <div class="format-grid">
                        <button type="button" class="format-btn" data-format="5">5v5</button>
                        <button type="button" class="format-btn" data-format="6">6v6</button>
                        <button type="button" class="format-btn" data-format="7">7v7</button>
                        <button type="button" class="format-btn" data-format="8">8v8</button>
                        <button type="button" class="format-btn" data-format="9">9v9</button>
                        <button type="button" class="format-btn" data-format="11">11v11</button>
                    </div>
                </div>
            </div>

            <!-- Equipos -->
            <div class="np-section">
                <div class="np-section-label">Equipos</div>
                <div class="team-names-row">
                    <div class="np-field np-field-flex">
                        <label>Equipo 1</label>
                        <input type="text" id="npTeam1Name" value="BLANCO" placeholder="Equipo 1">
                    </div>
                    <div class="team-names-vs">vs</div>
                    <div class="np-field np-field-flex">
                        <label>Equipo 2</label>
                        <input type="text" id="npTeam2Name" value="NEGRO" placeholder="Equipo 2">
                    </div>
                </div>
            </div>

            <!-- Jugadores -->
            <div class="np-section">
                <div class="np-section-label">Jugadores</div>

                <div class="players-status">
                    <span id="playersStatusText">Elegí un formato primero</span>
                    <span class="players-status-count">
                        <strong id="team1Count">0</strong> vs <strong id="team2Count">0</strong>
                    </span>
                </div>
                <div class="players-progress-bar">
                    <div class="players-progress-fill" id="progressFill"></div>
                </div>

                <div class="add-player-row">
                    <input type="text" id="newPlayerInput" placeholder="Agregar jugador nuevo..." autocomplete="off">
                    <button type="button" class="add-player-btn" onclick="addNewPlayer()">+ Agregar</button>
                </div>

                <div class="players-assign-list" id="playersAssignList"></div>
            </div>

            <!-- CTA -->
            <div class="np-cta">
                <div class="np-cta-info" id="npCtaInfo">Completá todos los campos</div>
                <button type="button" class="np-cta-btn" id="npSaveBtn" disabled onclick="saveAndStart()">
                    🚀 Guardar e iniciar partido
                </button>
            </div>

        </main>
    </div>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/nuevo-partido.js"></script>
</body>
</html>
