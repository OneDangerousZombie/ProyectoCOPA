<body>

                <div class="nav-item active" data-page="liga">
                    <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
                    Liga
                </div>
                <div class="nav-item" data-page="crear-partido">
                    <span class="nav-icon"><i class="fa-solid fa-futbol"></i></span>
                    Partidos
                </div>

                    Stats

                    <span class="app-topnav-user-avatar" id="navUserAvatar"><i class="fa-solid fa-user"></i></span>

    <div class="app-container">
        <!-- Header: título + buscador. Tiene función real (#searchInput

            </div>
            <button type="button" class="creator-bar-copy" id="btnCopiarCodigo" title="Copiar código">
                <i class="fa-solid fa-copy"></i> Copiar
            </button>
        </div>

        <div class="header">
            <h1>Jugadores</h1>
            <div class="search-box">
                <span><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" placeholder="Buscar jugador..." id="searchInput">
            </div>
        </div>

        <main class="main-content" id="playersContainer">
            <!-- JS popula -->
        </main>

        <nav class="bottom-nav">
            <div class="nav-item" data-page="home"><span class="nav-icon"><i class="fa-solid fa-house"></i></span>Inicio</div>
            <div class="nav-item active" data-page="liga"><span class="nav-icon"><i class="fa-solid fa-users"></i></span>Liga</div>

            <div class="nav-item" data-page="estadisticas"><span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span>Stats</div>

    <!-- Footer de desktop/tablet — FUERA de .app-container, full-bleed,
         siempre pegado abajo (ver app-footer.css). -->

        <div class="app-footer-inner">
            <div class="app-footer-top">

                    <img src="../images/icono-nav.png" alt="COPA" class="app-topnav-logo-img">
                </div>
                <nav class="app-footer-links">
                    <a href="home.html">Inicio</a>
                    <a href="liga.html">Liga</a>
                    <a href="crear-partido.html">Partidos</a>
                    <a href="estadisticas.html">Estadísticas</a>
                    <a href="perfil.html">Mi cuenta</a>
                    <a href="../index.html">Volver al sitio</a>
                </nav>
            </div>
            <div class="app-footer-bottom">© 2026 COPA — Proyecto académico</div>
        </div>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/app-topnav.js"></script>
    <script src="../scripts/liga.js"></script>
    <script>
    // ── Código de invitación para todos + tachito solo para ROL_LIGA=5 ──
    // El código se muestra siempre que el usuario esté en una liga activa.
    // El tachito solo aparece si el usuario es ROL_LIGA=5.

    document.addEventListener('DOMContentLoaded', function() {
        fetch('../api/session.php', { credentials: 'same-origin' })
            .then(function(r){ return r.json(); })
            .then(function(data) {
                if (!data.ok || !data.ligaActiva) return;
                var ligaId  = data.ligaActiva.id;
                var rolLiga = parseInt(data.ligaActiva.rol_liga) || 0;

                // Mostrar barra del código para TODOS
                var bar = document.getElementById('creatorBar');
                if (bar) bar.style.display = 'flex';

                fetch('../api/listar_ligas.php', { credentials: 'same-origin' })
                    .then(function(r2){ return r2.json(); })
                    .then(function(d2) {
                        var ligaData = (d2.misLigas || []).find(function(l){ return l.id === ligaId; });
                        var codigo = (ligaData && ligaData.codigo_invitacion) ? ligaData.codigo_invitacion : '—';
                        var valEl = document.getElementById('codigoValor');
                        if (valEl) valEl.textContent = codigo;
                        var btnCopiar = document.getElementById('btnCopiarCodigo');
                        if (btnCopiar) {
                            btnCopiar.addEventListener('click', function() {
                                navigator.clipboard.writeText(codigo).catch(function() {
                                    var ta = document.createElement('textarea');
                                    ta.value = codigo; document.body.appendChild(ta);
                                    ta.select(); document.execCommand('copy'); ta.remove();
                                });
                                btnCopiar.innerHTML = '<i class="fa-solid fa-check"></i> Copiado';
                                setTimeout(function() { btnCopiar.innerHTML = '<i class="fa-solid fa-copy"></i> Copiar'; }, 2000);
                            });
                        }
                    });

                // Tachito solo para ROL_LIGA=5
                if (rolLiga !== 5) return;
                window._esCreador = true;

                var container = document.getElementById('playersContainer');
                if (!container) return;

                function inyectarTachito(card) {
                    if (card.querySelector('.player-remove-btn')) return;
                    var nameEl = card.querySelector('.player-name');
                    if (!nameEl) return;
                    var nombre = nameEl.textContent.trim();
                    var player = (window.ligaPlayers || []).find(function(p){ return p.name === nombre; });
                    if (!player) return;
                    var btn = document.createElement('button');
                    btn.className = 'player-remove-btn';
                    btn.title = 'Dar de baja de la liga';
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        confirmarBaja(player.id, player.name);
                    });
                    card.appendChild(btn);
                }

                new MutationObserver(function(mutations) {
                    mutations.forEach(function(m) {
                        m.addedNodes.forEach(function(node) {
                            if (node.nodeType !== 1) return;
                            if (node.classList && node.classList.contains('player-card')) inyectarTachito(node);
                            node.querySelectorAll && node.querySelectorAll('.player-card').forEach(inyectarTachito);
                        });
                    });
                }).observe(container, { childList: true, subtree: true });

                container.querySelectorAll('.player-card').forEach(inyectarTachito);
            })
            .catch(function(){});
    });

    function confirmarBaja(idUsuario, nombre) {
        if (!confirm('¿Seguro que querés dar de baja a ' + nombre + ' de la liga?')) return;
        fetch('../api/bajarJugadorLiga.php', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin', body: JSON.stringify({ id_usuario: idUsuario })
        })
        .then(function(r){ return r.json(); })
        .then(function(data) {
            if (data.ok) {
                window.ligaPlayers = (window.ligaPlayers || []).filter(function(p){ return p.id !== idUsuario; });
                if (typeof renderPlayers === 'function') renderPlayers(window.ligaPlayers);
            } else { alert('Error: ' + (data.error || 'No se pudo dar de baja')); }
        })
        .catch(function() { alert('Error de conexión'); });
    }
    </script>
</body>
</html>
