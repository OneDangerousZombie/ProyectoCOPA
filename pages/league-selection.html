<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>COPA — Seleccionar Liga</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/league-selection.css">
</head>
<body>
    <div class="selection-container">
        <div class="page-header">
            <div class="logo-mark">⚽</div>
            <h1>Bienvenido a COPA</h1>
            <p>¿Qué querés hacer hoy?</p>
        </div>

        <div class="buttons-container">
            <button class="league-btn primary" onclick="window.location.href='home.html'">
                <div class="league-btn-icon">➕</div>
                <div class="league-btn-text">
                    Crear Liga
                    <span>Empezá tu propia liga de amigos</span>
                </div>
            </button>

            <div class="or-divider">o</div>

            <button class="league-btn secondary" onclick="window.location.href='home.html'">
                <div class="league-btn-icon">🤝</div>
                <div class="league-btn-text">
                    Unirme a una Liga
                    <span>Ingresá con un código de invitación</span>
                </div>
            </button>
        </div>
    </div>
</body>
</html>
