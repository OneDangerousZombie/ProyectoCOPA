<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>COPA — Seleccionar Liga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/league-selection.css">
</head>
<body>
    <div class="selection-container">
        <div class="page-header">
            <div class="logo-mark"><i class="fa-solid fa-futbol"></i></div>
            <h1>Bienvenido a COPA</h1>
            <p>¿Qué querés hacer hoy?</p>
        </div>

        <!-- ===== Tus ligas (solo aparece si ya pertenecés a alguna) ===== -->
        <div class="league-join-wrap" id="misLigasWrap" style="display:none; margin-bottom: 1rem;">
            <div class="league-dropdown active" style="position:static;">
                <div class="league-dropdown-list" id="misLigasList"></div>
            </div>
        </div>

        <div class="buttons-container">

            <!-- ===== Crear Liga ===== -->
            <button type="button" class="league-btn primary" id="createLeagueBtn">
                <div class="league-btn-icon"><i class="fa-solid fa-plus"></i></div>
                <div class="league-btn-text">
                    Crear Liga
                    <span>Empezá tu propia liga de amigos</span>
                </div>
            </button>

            <div class="or-divider">o</div>

            <!-- ===== Unirme a una Liga (despliega lista + código) ===== -->
            <div class="league-join-wrap">
                <button type="button" class="league-btn secondary" id="joinLeagueBtn" aria-expanded="false">
                    <div class="league-btn-icon"><i class="fa-solid fa-handshake"></i></div>
                    <div class="league-btn-text">
                        Unirme a una Liga
                        <span>Ingresá con un código de invitación</span>
                    </div>
                    <i class="fa-solid fa-chevron-down league-join-caret"></i>
                </button>

                <div class="league-dropdown" id="leagueDropdown">
                    <div class="create-league-field" style="padding: 0.75rem 1rem 0;">
                        <label for="joinLeagueCode">Código de invitación</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="joinLeagueCode" placeholder="Ej: A1B2C3" autocomplete="off" maxlength="10" style="flex:1; text-transform:uppercase;">
                            <button type="button" class="league-btn primary" id="joinByCodeBtn" style="flex:0 0 auto; padding: 0 1rem;">Unirme</button>
                        </div>
                    </div>
                    <div class="or-divider" style="margin: 0.5rem 0;">o elegí una liga pública</div>
                    <div class="league-dropdown-list" id="leagueDropdownList"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== Modal: Crear Liga (reutiliza .modal / .modal-content de global.css,
         el mismo patrón bottom-sheet que ya usa el resto de la Aplicación) ===== -->
    <div class="modal" id="createLeagueModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3>Crear tu liga</h3>
                <button type="button" class="close-modal" id="closeCreateLeagueModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="create-league-field">
                    <label for="newLeagueName">Nombre de la liga</label>
                    <input type="text" id="newLeagueName" placeholder="Ej: Liga 5 Estrellas" autocomplete="off">
                </div>

                <div class="create-league-field">
                    <label for="newLeaguePrivada">Visibilidad</label>
                    <select id="newLeaguePrivada">
                        <option value="0">Pública (cualquiera la puede ver y unirse)</option>
                        <option value="1">Privada (solo con código de invitación)</option>
                    </select>
                </div>

                <!-- Aparece recién después de crear la liga -->
                <div class="create-league-code" id="createLeagueCodeBox">
                    <span class="create-league-code-label">Código de invitación</span>
                    <span class="create-league-code-value" id="createLeagueCodeValue"></span>
                    <span class="create-league-code-hint">Compartilo para que se unan a tu liga</span>
                </div>

                <div class="create-league-field" id="createLeagueErrorBox" style="display:none; color:#ef4444; font-size:0.85rem;"></div>

                <button type="button" class="league-btn primary create-league-submit" id="createLeagueSubmitBtn">
                    Crear liga
                </button>
            </div>
        </div>
    </div>

    <script src="../scripts/league-selection.js"></script>
</body>
</html>
