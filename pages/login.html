<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>COPA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="desktop-shell">

        <!-- Header — visible en todos los anchos. En mobile/tablet chica
             (<860px) el nav y el botón se ocultan detrás del hamburger;
             desde 860px se muestran inline (ver login.css). -->
        <header class="desktop-header">
            <div class="logo-group">
                <div class="logo-icon-sm"><i class="fa-solid fa-futbol"></i></div>
                <span class="logo-text">COPA</span>
            </div>
            <nav class="desktop-nav">
                <a href="../caracteristicas.html">Características</a>
                <a href="../caracteristicas.html#como-funciona">Cómo funciona</a>
                <a href="../ligas.html">Ligas</a>
            </nav>
            <div class="desktop-header-actions">
                <!-- Pedido explícito: solo "Iniciar sesión" arriba a la derecha, sin botón de Registrarse -->
                <button type="button" class="desktop-btn-outline" onclick="switchTab('login')">Iniciar sesión</button>
            </div>

            <!-- Hamburger: solo visible <860px. Maneja su apertura/cierre
                 scripts/app-nav.js (archivo nuevo, no toca login.js). -->
            <button type="button" class="app-nav-hamburger" id="navHamburger" aria-label="Abrir menú" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </header>

        <!-- Backdrop + drawer del menú mobile — fuera del header para que
             el position:fixed no quede condicionado por su contenedor. -->
        <div class="app-nav-backdrop" id="navBackdrop"></div>
        <nav class="app-nav-drawer" id="navDrawer">
            <a href="../caracteristicas.html">Características</a>
            <a href="../caracteristicas.html#como-funciona">Cómo funciona</a>
            <a href="../ligas.html">Ligas</a>
            <div class="app-nav-drawer-divider"></div>
            <button type="button" class="app-nav-drawer-cta" onclick="switchTab('login')">Iniciar sesión</button>
        </nav>

        <!-- Main — contiene el card de login, igual en mobile y desktop -->
        <main class="desktop-main">
            <div class="login-container">
                <div class="logo">
                    <div class="logo-icon"><i class="fa-solid fa-futbol"></i></div>
                    <h1>COPA</h1>
                    <p>Computación de Organización y Parejos Automáticos</p>
                </div>

                <div class="form-card">
                    <!-- form-tabs se mantiene en el DOM (switchTab() de login.js no
                         tiene chequeo de null y rompería si #tabLogin/#tabRegister
                         no existieran) pero queda oculto visualmente: ya no se
                         muestran botones de tabs, el cambio de vista ahora es por
                         el link de abajo de cada bloque. -->
                    <div class="form-tabs">
                        <button type="button" class="form-tab active" id="tabLogin" onclick="switchTab('login')">Ingresar</button>
                        <button type="button" class="form-tab" id="tabRegister" onclick="switchTab('register')">Registrarse</button>
                    </div>

                    <form id="loginForm">

                        <!-- ===== Bloque LOGIN (visible por defecto) ===== -->
                        <div class="auth-fields auth-fields-login">
                            <div class="input-group">
                                <label>Usuario</label>
                                <input type="text" id="username" placeholder="Tu usuario" autocomplete="username">
                            </div>
                            <div class="input-group">
                                <label>Contraseña</label>
                                <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
                            </div>

                            <p class="auth-switch-hint">
                                ¿No tenés una cuenta?
                                <button type="button" class="auth-switch-link" onclick="switchTab('register')">Crear una cuenta nueva</button>
                            </p>
                        </div>

                        <!-- ===== Bloque REGISTRO (oculto hasta switchTab('register')) =====
                             IDs inputNombre / inputClave: ya son los que lee
                             handleRegister() en login.js. inputCorreo e
                             inputClaveRepeat son nuevos — todavía no los lee
                             ningún JS (funcionalidad pendiente, según lo acordado:
                             "la funcionalidad se la damos después"). -->
                        <div class="auth-fields auth-fields-register">
                            <div class="input-group">
                                <label>Nombre</label>
                                <input type="text" id="inputNombre" placeholder="Tu nombre de usuario" autocomplete="username">
                            </div>
                            <div class="input-group">
                                <label>Correo</label>
                                <input type="email" id="inputCorreo" placeholder="tu@correo.com" autocomplete="email">
                            </div>
                            <div class="input-group">
                                <label>Clave</label>
                                <input type="password" id="inputClave" placeholder="Elegí una contraseña" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>Repetir clave</label>
                                <input type="password" id="inputClaveRepeat" placeholder="Repetí la contraseña" autocomplete="new-password">
                            </div>

                            <p class="auth-switch-hint">
                                ¿Ya tenés una cuenta?
                                <button type="button" class="auth-switch-link" onclick="switchTab('login')">Iniciar sesión</button>
                            </p>
                        </div>

                        <div class="form-error" id="formError"></div>
                        <button type="submit" class="login-btn" id="submitBtn">Ingresar</button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer — visible solo en desktop ≥1200px -->
        <footer class="desktop-footer">
            <span>© 2026 COPA — Proyecto académico</span>
            <div class="desktop-footer-links">
                <span>Términos</span>
                <span>Privacidad</span>
                <span>Contacto</span>
            </div>
        </footer>

    </div>

    <script src="../scripts/login.js"></script>
    <script src="../scripts/app-nav.js"></script>
</body>
</html>
