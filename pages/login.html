<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>COPA</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="desktop-shell">

        <!-- Header — visible solo en desktop ≥1200px -->
        <header class="desktop-header">
            <div class="logo-group">
                <div class="logo-icon-sm">⚽</div>
                <span class="logo-text">COPA</span>
            </div>
            <nav class="desktop-nav">
                <span>Características</span>
                <span>Cómo funciona</span>
                <span>Ligas</span>
            </nav>
            <div class="desktop-header-actions">
                <button type="button" class="desktop-btn-outline" onclick="switchTab('login')">Iniciar sesión</button>
                <button type="button" class="desktop-btn-solid" onclick="switchTab('register')">Registrarse</button>
            </div>
        </header>

        <!-- Main — contiene el card de login, igual en mobile y desktop -->
        <main class="desktop-main">
            <div class="login-container">
                <div class="logo">
                    <div class="logo-icon">⚽</div>
                    <h1>COPA</h1>
                    <p>Computación de Organización y Parejos Automáticos</p>
                </div>

                <div class="form-card">
                    <div class="form-tabs">
                        <button type="button" class="form-tab active" id="tabLogin" onclick="switchTab('login')">Ingresar</button>
                        <button type="button" class="form-tab" id="tabRegister" onclick="switchTab('register')">Registrarse</button>
                    </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label>Usuario</label>
                        <input type="text" id="username" placeholder="Tu usuario" autocomplete="username">
                    </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
                </div>

                <div class="form-error" id="formError"></div>
                <button type="submit" class="login-btn" id="submitBtn" onclick="handleSubmit()">Ingresar</button>
                </form>
                </div>
            </div>
        </main>

        <!-- Footer — visible solo en desktop ≥1200px -->
        <footer class="desktop-footer">
            <span>© 2026 COPA — Proyecto académico</span>
            <div class="desktop-footer-links">
                <span>Términos</span>
                <span>Privacidad</span>
                <span>Contacto</span>
            </div>
        </footer>

    </div>

    <script src="../scripts/login.js"></script>
</body>
</html>
